# Profile variants. Selection picks the one with the highest tag overlap with
# the job, used verbatim (no rewriting). Same selection logic as the bullets.
profiles:
  - tags: [esg, consulting]
    text: "Experience across sustainability consulting, ESG and human rights due diligence, and the built environment, including climate risk work on internationally financed infrastructure. Currently completing an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on data-driven approaches to sustainability and the built environment. Hands-on skills span human rights and supply chain due diligence, climate risk assessment, and the technical grounding to connect sustainability requirements to delivery. Motivated by work where analytical rigor and domain knowledge inform real decisions."

  - tags: [proptech]
    text: "Experience in computational design, spatial data analysis, and the built environment, applying Python, GIS, and machine learning to real estate and urban problems. Currently completing an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on applying computational and data methods to real estate and urban development challenges. Hands-on skills span GIS-based spatial analysis, machine learning, parametric design workflows, and building data tools for the built environment. Motivated by work where domain knowledge and data fluency change how cities and buildings get planned and built."

  - tags: [proptech, real-estate]
    text: "Experience across real estate development and computational design, combining feasibility and financial analysis with Python, GIS, and machine learning applied to property and urban data. Currently completing an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on applying computational and data methods to real estate and urban development challenges. Hands-on skills span financial feasibility modeling, GIS-based spatial analysis, machine learning, and parametric design workflows. Motivated by work where better data changes how real estate gets analyzed and decided."

  - tags: [real-estate]
    text: "Experience in real estate development, feasibility, and financial modeling, with additional grounding in zoning analysis and computational methods applied to property and urban data. Currently completing an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on applying computational and data methods to real estate and urban development challenges. Hands-on skills span financial feasibility modeling, zoning and land-use analysis, GIS-based spatial analysis, and volumetric studies. Motivated by work where rigorous analysis drives decisions about what gets built and where."

  - tags: [infrastructure, consulting]
    text: "Experience in international infrastructure consulting across water and energy projects, spanning climate risk assessment, GIS-based spatial analysis, and bid and proposal delivery. Currently completing an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on data-driven approaches to the built environment. Hands-on skills span climate risk assessment, GIS analysis, technical documentation, and tender preparation for development-bank-funded projects. Motivated by work where technical analysis and environmental assessment inform infrastructure decisions."

