<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antonio Carmagnani - CV</title>

  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="../assets/cv.css" />

  <style>
    :root {
      --scale: 1.83
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js" defer></script>
  <script defer>
    // ---------- Utilities ----------
    function create(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text != null) el.textContent = text;
      return el;
    }
    function b1(text) {
      const el = document.createElement('b1');
      if (text != null) el.textContent = text;
      return el;
    }
    function fmtMonthYear(iso) {
      // Accepts "YYYY-MM" or "YYYY-MM-DD"; returns "MM.YYYY". Falls back to raw if unparsable
      if (!iso || typeof iso !== 'string') return '';
      const m = iso.match(/^(\d{4})-(\d{2})/);
      if (!m) return iso;
      return `${m[2]}.${m[1]}`;
    }
    function joinDates(start, end) {
      const s = fmtMonthYear(start);
      const e = fmtMonthYear(end);
      if (s && e) return `${s} - ${e}`;
      return s || e || '';
    }
    function listify(container, items) {
      if (!Array.isArray(items) || items.length === 0) return;
      const ul = create('ul');
      items.forEach(item => {
        const text = typeof item === 'string' ? item : (item?.text ?? '');
        const li = create('li');
        li.appendChild(b1(text));
        ul.appendChild(li);
      });
      container.appendChild(ul);
    }
    function entryBlock({ titleLeft, location, dates, bullets }) {
      const block = create('div', 'entry-block');

      const header = create('div', 'entry-header');
      const left = b1(titleLeft);
      const loc = create('span', 'entry-location');
      loc.appendChild(b1(location || ''));
      header.appendChild(left);
      header.appendChild(loc);

      const datesEl = create('div', 'entry-dates');
      datesEl.appendChild(b1(dates || ''));

      block.appendChild(header);
      block.appendChild(datesEl);

      const bulletsWrap = create('div');
      listify(bulletsWrap, bullets || []);
      block.appendChild(bulletsWrap);

      return block;
    }

    // content_base.yaml stores experience as points -> variants. When rendering
    // straight from base (no tailored file), flatten each point to its first
    // variant so we get one bullet per fact. A real tailored content_tailored.yaml
    // already holds plain-string bullets and skips this path.
    function pointsToBullets(points) {
      if (!Array.isArray(points)) return [];
      return points
        .map(p => (p.variants && p.variants[0] && p.variants[0].text) || '')
        .filter(Boolean);
    }
    function flattenBaseExperience(experience = []) {
      return experience.map(role => ({
        title: role.title, org: role.org, location: role.location,
        start: role.start, end: role.end,
        bullets: pointsToBullets(role.points),
      }));
    }

    // ---------- Selection resolver ----------
    // A per-application selection.yaml lists only IDs. We resolve them against
    // content_base.yaml here, so no CV text is ever copied into an application
    // folder. Bullet order inside each role follows the order given in the file.
    function resolveSelection(sel, base, presets) {
      const variantById = new Map();
      (base.experience || []).forEach((role, ri) => {
        (role.points || []).forEach((point, pi) => {
          (point.variants || []).forEach(v => {
            if (v.id) variantById.set(v.id, { text: v.text, ri, pi });
          });
        });
      });
      const byProjectId = new Map((base.projects || []).map(p => [p.id, p]));
      const skillKeys = Object.keys(base.skills || {});
      const roleIds = (base.experience || []).map(r => r.id);

      // An application usually just extends a preset and records the delta.
      let preset = {};
      if (sel.extends) {
        preset = ((presets || {}).presets || {})[sel.extends];
        if (!preset) throw new Error(`Unknown preset: ${sel.extends}`);
      }

      const res = {
        profile: sel.profile || preset.profile,
        bullets: [...(sel.bullets || preset.bullets || [])],
        projects: [...(sel.projects || preset.projects || [])],
        roles: [...(sel.roles || preset.roles || [])],
        skills: [...(sel.skills || preset.skills || skillKeys)],
      };

      // add/drop are routed by what the id actually is, so one flat list can
      // carry bullets, projects and skill groups at once.
      const kindOf = id => variantById.has(id) ? 'bullets'
                         : byProjectId.has(id) ? 'projects'
                         : skillKeys.includes(id) ? 'skills' : null;
      (sel.drop || []).forEach(id => {
        const k = kindOf(id);
        if (!k) throw new Error(`Unknown id in drop: ${id}`);
        res[k] = res[k].filter(x => x !== id);
      });
      (sel.add || []).forEach(id => {
        const k = kindOf(id);
        if (!k) throw new Error(`Unknown id in add: ${id}`);
        if (!res[k].includes(id)) res[k].push(id);
      });

      const missing = res.bullets.filter(id => !variantById.has(id));
      if (missing.length) throw new Error(`Unknown bullet id(s): ${missing.join(', ')}`);

      const rank = new Map(res.bullets.map((id, i) => [id, i]));
      const used = new Set(res.bullets.map(id => variantById.get(id).ri));

      // Roles render in base order, which is reverse-chronological. A CV is
      // reverse-chronological, full stop. `roles` only declares which roles a
      // block shows; it never reorders them.
      const order = [...used].sort((a, b) => a - b);

      const experience = order.map(ri => {
        const role = base.experience[ri];
        return {
          title: role.title, org: role.org, location: role.location,
          start: role.start, end: role.end,
          bullets: res.bullets
            .filter(id => variantById.get(id).ri === ri)
            .sort((a, b) => rank.get(a) - rank.get(b))
            .map(id => variantById.get(id).text),
        };
      });

      const profile = (base.profiles || []).find(p => p.id === res.profile);
      if (res.profile && !profile) throw new Error(`Unknown profile id: ${res.profile}`);

      const projects = res.projects.map(id => {
        if (!byProjectId.has(id)) throw new Error(`Unknown project id: ${id}`);
        return byProjectId.get(id);
      });

      return {
        profile: profile ? profile.text : null,
        experience,
        projects,
        skillOrder: res.skills.filter(s => skillKeys.includes(s)),
      };
    }

    async function loadYAML(path) {
      const res = await fetch(path, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`Failed to fetch ${path}: ${res.status}`);
      const text = await res.text();
      return jsyaml.load(text);
    }

    function renderMeta(root, meta) {
      document.title = `${meta?.name ?? '-'} - CV`;

      const header = create('div', 'header');
      const h1 = create('h1');
      h1.textContent = meta?.name ?? '';
      header.appendChild(h1);

      const contact = create('div', 'contact-info');
      const parts = [meta?.location, '•', meta?.phone, '•', meta?.email].filter(Boolean);
      parts.forEach((t, i) => {
        contact.appendChild(b1(t));
        if (i < parts.length - 1) contact.appendChild(document.createTextNode(' '));
      });

      header.appendChild(contact);
      root.appendChild(header);
      root.appendChild(create('hr'));
    }

    function renderProfile(root, profile) {
      if (!profile) return;
      const section = create('div', 'cv-section');
      const title = create('div', 'section-title');
      title.appendChild(b1('PROFILE'));
      const content = create('div', 'section-content');
      content.appendChild(b1(profile));
      section.appendChild(title);
      section.appendChild(content);
      root.appendChild(section);
    }

    function renderExperience(root, experience = []) {
      if (!experience.length) return;
      const section = create('div', 'cv-section');
      const title = create('div', 'section-title');
      title.appendChild(b1('Experience'));
      const content = create('div', 'section-content');

      experience.forEach(role => {
        const left = [role.title, role.org].filter(Boolean).join(' @ ');
        const dates = joinDates(role.start, role.end);
        content.appendChild(entryBlock({
          titleLeft: left,
          location: role.location,
          dates,
          bullets: role.bullets
        }));
      });

      section.appendChild(title);
      section.appendChild(content);
      root.appendChild(section);
    }

    function renderEducation(root, education = []) {
      if (!education.length) return;
      const section = create('div', 'cv-section');
      const title = create('div', 'section-title');
      title.appendChild(b1('Education'));
      const content = create('div', 'section-content');

      education.forEach(ed => {
        const left = [ed.degree, ed.school].filter(Boolean).join(' @ ');
        const dates = joinDates(ed.start, ed.end);
        const block = create('div', 'entry-block');

        const header = create('div', 'entry-header');
        header.appendChild(b1(left));
        const loc = create('span', 'entry-location');
        loc.appendChild(b1(ed.location || ''));
        header.appendChild(loc);

        const datesEl = create('div', 'entry-dates');
        datesEl.appendChild(b1(dates));

        block.appendChild(header);
        block.appendChild(datesEl);
        content.appendChild(block);
      });

      section.appendChild(title);
      section.appendChild(content);
      root.appendChild(section);
    }

    function renderProjects(root, projects = []) {
      if (!projects.length) return;
      const section = create('div', 'cv-section');
      const title = create('div', 'section-title');
      title.appendChild(b1('Projects'));
      const content = create('div', 'section-content');

      projects.forEach(p => {
        const left = [p.name, p.org].filter(Boolean).join(' @ ');
        const block = entryBlock({
          titleLeft: left,
          location: p.location,
          dates: joinDates(p.start, p.end),
          bullets: p.bullets
        });
        content.appendChild(block);
      });

      section.appendChild(title);
      section.appendChild(content);
      root.appendChild(section);
    }

    function renderSkills(root, skills, order) {
      if (!skills) return;
      const section = create('div', 'cv-section');
      const title = create('div', 'section-title');
      title.appendChild(b1('Skills'));
      const content = create('div', 'section-content');

      const LABELS = {
        data_and_analysis: 'Data & Analysis',
        digital_tools: 'Digital Tools',
        esg_and_sustainability: 'ESG & Sustainability',
        real_estate_and_urban: 'Real Estate & Urban',
        languages: 'Languages',
      };
      const keys = (order && order.length) ? order : Object.keys(LABELS);
      const groups = keys.map(k => [LABELS[k] || k, skills[k]]);

      const ul = create('ul');
      groups.forEach(([label, arr]) => {
        if (!Array.isArray(arr) || arr.length === 0) return;
        const li = create('li');
        const strong = b1(`${label}: ${arr.join(', ')}`);
        li.appendChild(strong);
        ul.appendChild(li);
      });
      content.appendChild(ul);

      section.appendChild(title);
      section.appendChild(content);
      root.appendChild(section);
    }

    async function main() {
      // Load base (stable: meta, education, skills, full experience/projects)
      // and tailored (per-application overrides for profile/experience/projects).
      // Tailored fields, when present, override base fields.
      const baseData = await loadYAML('../../content_base.yaml');

      // Preset CV blocks. Optional: a selection can still list everything by hand.
      let presetsData = { presets: {} };
      try { presetsData = await loadYAML('../../presets.yaml'); } catch (e) { /* no presets file */ }

      let tailoredData = {};

      // ?preset=<name> renders a preset block directly, so the blocks themselves
      // can be reviewed without creating a throwaway application folder.
      const presetParam = new URLSearchParams(location.search).get('preset');

      try {
        if (presetParam) {
          tailoredData = resolveSelection({ extends: presetParam }, baseData, presetsData);
        } else {
        const pointerRes = await fetch('../../active_application.txt', { cache: 'no-cache' });
        if (pointerRes.ok) {
          const pointer = (await pointerRes.text()).trim();
          if (pointer) {
            const dir = `../../applications/${pointer}`;
            try {
              // Preferred format: selection.yaml (ids only, resolved against base).
              const sel = await loadYAML(`${dir}/selection.yaml`);
              tailoredData = resolveSelection(sel, baseData, presetsData);
            } catch (selErr) {
              if (/Unknown (bullet|profile|project|preset|id)/.test(selErr.message)) throw selErr;
              // Legacy format: content_tailored.yaml with full text copied in.
              tailoredData = await loadYAML(`${dir}/content_tailored.yaml`);
            }
          }
        }
        }
      } catch (e) {
        if (presetParam) throw e;
        // No pointer or no tailored file - render from base only
        tailoredData = {};
      }

      const data = {
        meta: baseData.meta,
        education: baseData.education,
        skills: baseData.skills,
        profile: tailoredData.profile ?? baseData.profiles?.[0]?.text ?? null,
        experience: tailoredData.experience ?? flattenBaseExperience(baseData.experience),
        projects: tailoredData.projects ?? baseData.projects,
        skillOrder: tailoredData.skillOrder ?? null,
      };

      const container = document.querySelector('.cv-container');

      renderMeta(container, data.meta);
      renderProfile(container, data.profile);
      renderExperience(container, data.experience);
      renderEducation(container, data.education);
      renderProjects(container, data.projects);
      renderSkills(container, data.skills, data.skillOrder);

    }

    window.addEventListener('DOMContentLoaded', () => {
      main().catch(err => {
        const root = document.querySelector('.cv-container');
        const notice = create('div');
        notice.style.color = 'crimson';
        notice.style.marginTop = '1rem';
        notice.textContent = `Failed to render CV: ${err.message}`;
        root.appendChild(notice);
        // Fallback: static skeleton
      });
    });
  </script>
</head>

<body>
  <noscript>
    <div style="max-width:900px;margin:1rem auto;padding:1rem;border:1px solid #ccc;">
      This CV requires JavaScript to load <code>content.yaml</code>. Please enable JavaScript or pre-render this
      template.
    </div>
  </noscript>

  <div class="cv-container">
    <!-- Populated from content.yaml by the script above -->
  </div>
</body>

</html>
