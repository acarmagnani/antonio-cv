# Novo Nordisk Consulting, Project Associate, Denmark.
#
# Built by hand, no `extends`. None of the three blocks is aimed at a management
# consultancy: they all sell a built-environment specialist, and this reader
# wants a consultant. The subject matter is pharma, which Antonio cannot claim,
# so the CV argues method instead. Structured problem solving, frameworks applied
# to corporate clients, quantitative prioritisation, deliverables that senior
# stakeholders read, and change that actually landed in an organisation.
#
# The spine, in Antonio's own words for this application: two large Danish
# consultancies already. Ramboll Management Consulting is literally the
# "management consultancy" the posting says is highly regarded, and Sweco is
# international advisory. Those two roles carry ten of the twenty-two bullets.
#
# The other roles are here for one thing each. Isay Weinfeld is the business
# impact story (a tool that cut a task from days to twenty minutes and then got
# adopted across ten-plus projects, which is change management with a number on
# it). OSPA is analysis presented to a client. Itau is a large corporate and a
# manual process replaced. Independent is running a business end to end.
#
# Deliberately left out: everything real-estate-specific that would read as a
# domain specialist rather than a generalist. No zoning, no buildable capacity,
# no feasibility beyond the anchor, no BIM, no valuation.

profile: profile.esg-consulting

roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]

