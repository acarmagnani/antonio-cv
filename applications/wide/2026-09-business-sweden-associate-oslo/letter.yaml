    The Oslo role asks for both halves at once, since proposals, partner and customer
    identification, and meetings with public-sector representatives are the substance of the week
    rather than an occasional addition to it.
  exp.ramboll.esg-data: >
    Market intelligence rests on that discipline too, since an insight a company will act on in a
    new market has to hold up in front of the executives paying for it.

closing_reason: >
  Business Sweden advises Swedish companies on entering and growing in a market, with the analysis
  and the client relationship carried by the same small team.
