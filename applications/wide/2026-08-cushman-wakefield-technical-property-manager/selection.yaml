# Cushman & Wakefield, Technical Property Manager, Asset Services, España.
#
# Built by hand, no `extends`. This is a fourth family none of the three blocks
# covers: technical management of buildings already in operation. The direction
# is buildings, compliance, contractors and energy, not investment analysis
# (real-estate-investment), not sustainability strategy (esg-built-environment),
# not modelling (data-built-environment).
#
# What the CV has to say, in order: he has checked buildings against technical
# and legal norms before work was authorised (Itau), he has audited what
# contractors deliver (Sweco design review, Ramboll supplier work), he has run
# tenders and priced contracts (Sweco), he has tracked energy and certifications
# on real assets (Itau, Ramboll), and he has built the cost-tracking tools this
# seat runs on (Itau VBA dashboard, private-client financial tool).
#
# Deliberately left out: feasibility and zoning depth, the house price model,
# the human rights strand at Ramboll, all parametric and design work. None of it
# is what an asset services team reads.

profile: profile.real-estate-esg-data

roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]

