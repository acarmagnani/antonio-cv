# Collen, Estimator in preconstruction (Copenhagen). Fits no preset: the seat is tendering
# and construction cost, so this is built by hand around the bid and tender work at Sweco,
# the development-cost side of the feasibility roles, and the construction documentation
# strand that a contractor actually reads. The investment framing is deliberately dialled
# down, and zoning is out entirely.

profile: profile.real-estate

roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]

bullets:
  # Sweco: the closest thing he has to this job, tenders end to end plus pricing
  - sweco.department-anchor.v1
  - sweco.tender-bid-team-assembly.v1
  - sweco.tender-methodology.v1
  - sweco.project-pricing-model.v1
  - sweco.engineering-design-review.v1

  # Ramboll: kept to two, led by the supply chain mapping rather than the ESG frameworks
  - ramboll.frameworks-anchor.v1
  - ramboll.critical-raw-materials-study.v1

