    end: "Present"
    bullets:
      - "Authored climate risk assessments for major water supply projects following JASPERS and EBRD climate-proofing guidance, screening hazards against projections data and rating risk by exposure and vulnerability for each asset."
      - "Support consulting teams delivering internationally funded infrastructure projects in water, energy, and transport across emerging and developing economies, financed by development banks including the World Bank, EBRD, IFDK, KfW and EIB."
