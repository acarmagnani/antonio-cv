# Projects are tag-selectable at the PROJECT level: a whole project is included
# when its tags overlap the job. Bullets are always shown verbatim, never split.
projects:
  - name: "Master's Thesis, Computational Urban Analysis for Intensification Strategy"
    org: "The Royal Danish Academy"
    location: "Copenhagen, DK"
    tags: [proptech, real-estate]
    bullets:
      - "Developed a computational framework to identify underused spaces in the historic city center of São Paulo, Brazil, combining urban morphology analysis, land use data, and social vulnerability indicators."
      - "Built an algorithm that uses urban data, including building typology, use patterns, regulatory conditions, and building use, to generate programmatic and morphological typologies for urban intensification, aligned with the city's existing urban policies."
      - "Integrated multiple geospatial datasets in QGIS to map spatial relationships between buildings, zoning conditions, and social context at the neighborhood scale."

  - name: "Real Estate Development Recommendation Tool"
    org: "The Royal Danish Academy"
    location: "Copenhagen, DK"
    tags: [proptech, real-estate, esg]
    bullets:
      - "Built a machine learning tool that generates site-specific development recommendations for buildings in Copenhagen by integrating financial, social, sustainability, and geospatial data."
      - "Designed a user interface allowing different stakeholders to adjust impact drivers and weighting, with predictive outputs aligned to ESG priorities and local development conditions."

  - name: "Embodied Carbon Toolkit"
    location: "Copenhagen, DK"
    tags: [esg, proptech]
    bullets:
      - "Collaborated with a Copenhagen-based LCA startup to design and deliver a Revit-based toolkit for embodied carbon calculations, integrating the platform's GWP values for A1-A3 and A4 stages."
      - "Built a pre-configured Revit schedule that computes embodied carbon with built-in documentation for adoption by architects."

  - name: "Computational Deployable Structures Workshop"
    org: "Southeast University x The Royal Danish Academy"
    location: "Nanjing, CN"
    tags: [proptech]
    bullets:
      - "Selected as one of a small group from The Royal Danish Academy for a two-week international workshop at Southeast University, applying origami-based deployable-structure principles (used in satellite deployment) to architectural structures."
      - "Developed parametric models exploring foldable geometry, material systems, and structural performance, working across computational design, geometry, and engineering."

  - name: "House Price Prediction - Competition"
    location: "Copenhagen, DK"
    tags: [proptech, real-estate]
    bullets:
      - "Built a predictive model for real estate valuation using ensemble learning (XGBoost, LightGBM, Ridge, CatBoost) and feature engineering on structured property and financial data, finishing in the top 2% of competitors."

  - name: "Rammed Blue Biomass & Computational Optimization"
    org: "The Royal Danish Academy"
    location: "Copenhagen, DK"
    tags: [esg, proptech]
    bullets:
      - "Developed a new construction technique and material system using blue biomass (seashells and algae), applying LCA metrics and parametric simulations to optimize structural performance and environmental impact."
      - "Project was selected as a semester highlight and served as the material foundation for the school's installation at the Venice Architecture Biennale 2025, presented in collaboration with CITA, GXN, and 3XN at the Arsenale."

  - name: "Venice Architecture Biennale 2025"
    org: "The Royal Danish Academy, CITA, GXN, 3XN"
    location: "Venice, IT"
    tags: [esg, proptech]
    bullets:
      - "Contributed to the Matanzas panel by developing geospatial mappings to analyze local material sources and supply flows, producing cartographic work that informed the site's material research."
      - "Contributed to the Veneto panel by producing the physical exhibition panels displayed in the 7-metre installation at the Arsenale, which used the blue biomass composite technique developed during the semester project."

