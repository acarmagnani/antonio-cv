profiles:
  - text: "Background spanning ESG consulting, built environment practice, and data analysis, with direct experience in human rights due diligence, infrastructure advisory, and development feasibility. I bring a fesh perspective to business teams with a combination of technical built environment knowledge and sustainability expertise working at that intersection. Drawn to roles where analytical rigor and domain grounding are both expected."
    tags: [esg, consulting]

  - text: "Background spanning real estate development, ESG consulting, and computational analysis, with technical skills in Python, GIS, and machine learning applied to built environment problems. Domain knowledge and data fluency in the same background bring a fresh perspective to teams building tools for real estate and cities. Motivated by work where better data changes how cities and buildings get planned and built."
    tags: [proptech]

  - text: "Background in real estate feasibility, financial modeling, and zoning analysis, with additional training in machine learning and spatial analysis applied to property and urban data. The combination of development experience and computational skills brings a fresh perspective to real estate and investment teams. Motivated by roles where rigorous analysis and sustainability awareness inform real decisions about what gets built and where."
    tags: [real-estate]

  - text: "Experience in infrastructure consulting across climate risk assessment, GIS-based spatial analysis, ESG due diligence, and client-facing documentation. Working across technical analysis, environmental assessment, and consulting delivery, bringing a cross-disciplinary perspective that complements specialized infrastructure teams."
    tags: [infrastructure, consulting]

