# Profile variants. Selection picks the one with the highest tag overlap with
# the job, used verbatim (no rewriting). Same selection logic as the bullets.
profiles:
  - tags: [esg, consulting]
    text: "Experience across sustainability consulting and the built environment, from ESG and human rights due diligence to climate risk work on internationally financed infrastructure. Recently completed an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on data-driven approaches to sustainability. Hands-on skills span the UNGP and OECD due-diligence frameworks, climate hazard and risk assessment, and building structured analytical tools in Excel and Python. Motivated by work where sustainability, the built environment, and rigorous analysis intersect."

  - tags: [proptech]
    text: "Experience in computational design and data analysis for real estate and cities, spanning academic research and architecture practice. Recently completed an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on computational and data methods for real estate and urban development. Hands-on skills span Python, QGIS, and machine learning, parametric workflows in Grasshopper, and building data tools that turn spatial and financial data into decisions. Motivated by work where the built environment, technology, and data intersect."

  - tags: [proptech, real-estate]
    text: "Experience across real estate development and computational design, from feasibility and financial analysis to spatial and predictive modeling. Recently completed an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on computational and data methods for real estate and urban development. Hands-on skills span financial feasibility modeling, GIS and spatial analysis, and machine learning applied to property and market data. Motivated by work where real estate, technology, and data intersect."

  - tags: [real-estate]
    text: "Experience in real estate development, feasibility, and financial modeling, grounded in zoning and land-use analysis across multiple markets. Recently completed an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on computational and data methods for real estate and urban development. Hands-on skills span feasibility and P&L modeling, zoning and buildable-potential analysis, and volumetric studies in Revit. Motivated by work where real estate, finance, and design intersect."

  - tags: [infrastructure, consulting]
    text: "Experience in international infrastructure consulting on water and energy projects across emerging economies, working from tender through delivery. Recently completed an M.Arch. in Architecture Computation at The Royal Danish Academy, with a focus on data-driven approaches to the built environment. Hands-on skills span climate risk assessment (JASPERS/EBRD), GIS-based spatial analysis, and preparing technical documentation and tenders for development-bank-funded projects. Motivated by work where infrastructure, sustainability, and technical analysis intersect."

