# Preset CV blocks.
#
# A preset is a ready-made CV for a FAMILY of jobs, not for one job. It says which
# profile, which roles appear, which bullets, which projects, and which skill groups.
# Ids only, resolved against content_base.yaml at render time. No CV text lives here.
#
# The point of a preset is that each block POINTS ONE DIRECTION. Within a role, pick
# the bullets that serve this block's direction and leave the rest out, so a reader
# who knows nothing about the employer still reads a coherent trajectory. Felipe Hess
# and Isay Weinfeld should read as real estate development in the real-estate block
# and as computational work in the data block: same jobs, different true subset.
#
# `roles` declares which roles the block shows. It does NOT set the order. Roles
# always render reverse-chronologically, in content_base.yaml order. That is fixed.
#
# An application normally just points at a block and says what was special about that
# particular job:
#
#     extends: real-estate-investment
#     add:
#       - ramboll.genesta-supplier-human-rights.v1
#     drop:
#       - itau.new-office-towers-technical.v2
#
# `add` and `drop` also accept project ids and skill-group names. To override the
# profile, set `profile:` in the selection. A job that fits no block can ignore
# `extends` and list everything by hand.
#
# Blocks are derived from what Antonio actually applies to, not from guesswork. See
# applications/target/ and applications/wide/.

presets:

  # ---------------------------------------------------------------------------
  real-estate-investment:
    label: "Real Estate Investment & Analysis"
    use_for: >
      Investment and acquisitions analyst, valuation and advisory, development
      analyst, real estate research. The direction Antonio is actively steering
      toward. Matches Clikalia, EY-Parthenon transaction RE, Genesta, Greystar,
      Urban Partners, Cushman & Wakefield.
    profile: profile.real-estate-investment
    roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]
    bullets:
      # Sweco: asset risk work for institutional lenders
      - sweco.department-anchor.v2
      - sweco.climate-risk-assessments.v3
      - sweco.project-pricing-model.v1
      - sweco.geospatial-data-and-analysis.v1

      # Ramboll: due diligence, led by the real estate investment clients
      - ramboll.frameworks-anchor.v2
      - ramboll.genesta-code-of-conduct.v1
      - ramboll.real-estate-esg.v1
      - ramboll.colt-salience-tool.v2

      # Isay Weinfeld: development, not architecture. The Grasshopper plugin is
      # deliberately left to the data block; here it would pull the wrong way.
      - isay.portfolio-anchor.v2
      - isay.buildable-capacity.v1
      - isay.development-through-construction.v1

      # OSPA: the anchor role for this block
      - ospa.feasibility-anchor.v1
      - ospa.numerical-feasibility-financial-modeling.v1
      - ospa.zoning-land-use-regulatory.v1
      - ospa.volumetric-massing-study.v2
      - ospa.client-presentations.v1

      # Felipe Hess: reads as pure real estate here. zoning-feasibility-study is
      # left out only because buildable-capacity covers the same ground better.
      - felipe.portfolio-anchor.v2
      - felipe.developer-first-building.v1
      - felipe.buildable-capacity.v1
      - felipe.financial-feasibility.v1

      # Itau: building-level due diligence on assets a bank was buying or leasing
      - itau.documentation-review-anchor.v2
      - itau.building-environmental-energy.v1
      - itau.new-office-towers-technical.v2

      # Independent: the generic AEC framing, plus the commercial and financial
      # angles. The visualization and design strands stay out of this block.
      - independent.anchor.v1
      - vizu.studio-anchor.v3
      - independent.financial-analysis-tool.v1
    projects:
      - project.house-price-prediction
      - project.real-estate-development
      - project.masters-thesis-computational
    skills: [real_estate_and_urban, data_and_analysis, esg_and_sustainability, languages]

  # ---------------------------------------------------------------------------
  esg-built-environment:
    label: "Sustainability & ESG in the Built Environment"
    use_for: >
      Sustainability consulting, carbon and energy assessment, CSRD and EU
      Taxonomy work, building certification. Matches Jacobs, Bureau Veritas,
      NIRAS, EY sustainability data analytics, CBRE energy analyst.
    profile: profile.esg-consulting
    roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]
    bullets:
      - sweco.department-anchor.v1
      - sweco.climate-risk-assessments.v1
      - sweco.azerbaijan-field-mission.v1
      - sweco.geospatial-data-and-analysis.v1

      - ramboll.frameworks-anchor.v1
      - ramboll.real-estate-esg.v1
      - ramboll.nordzucker-hria-tool.v1
      - ramboll.colt-salience-tool.v1
      - ramboll.critical-raw-materials-study.v1

      - isay.portfolio-anchor.v1
      - isay.environmental-daylight-analysis.v1
      - isay.staircase-grasshopper-plugin.v1

      - ospa.feasibility-anchor.v1
      - ospa.environmental-analysis.v1
      - ospa.numerical-feasibility-financial-modeling.v1

      - felipe.portfolio-anchor.v1
      - felipe.environmental-analysis.v1

      - itau.documentation-review-anchor.v1
      - itau.building-environmental-energy.v1
      - itau.new-office-towers-technical.v1

      - independent.anchor.v1
      - vizu.studio-anchor.v3
      - independent.lca-startup-consulting.v1
    projects:
      - project.rammed-blue-biomass
      - project.real-estate-development
      - project.masters-thesis-computational
    skills: [esg_and_sustainability, data_and_analysis, real_estate_and_urban, languages]

  # ---------------------------------------------------------------------------
  data-built-environment:
    label: "Data & Computation in the Built Environment"
    use_for: >
      Data analyst and analytics engineer, computational design, pricing and
      valuation modelling, proptech. Matches GXN, Hobbii, SEB portfolio analyst,
      Trackunit, and the modelling half of Clikalia.
    profile: profile.proptech
    roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]
    bullets:
      - sweco.department-anchor.v1
      - sweco.geospatial-data-and-analysis.v1
      - sweco.office-gis-lead.v1
      - sweco.project-pricing-model.v1

      - ramboll.frameworks-anchor.v1
      - ramboll.colt-salience-tool.v2
      - ramboll.ai-in-research-workflow.v1
      - ramboll.critical-raw-materials-study.v2

      - isay.portfolio-anchor.v1
      - isay.staircase-grasshopper-plugin.v1
      - isay.staircase-plugin-adoption-teaching.v1
      - isay.complex-organic-parametric-modeling.v1

      - ospa.feasibility-anchor.v1
      - ospa.numerical-feasibility-financial-modeling.v1
      - ospa.volumetric-massing-study.v1

      - felipe.portfolio-anchor.v1
      - felipe.bim-documentation.v1

      - itau.documentation-review-anchor.v1
      - itau.furniture-inventory-tool.v1

      - independent.anchor.v2
      - vizu.studio-anchor.v3
      - independent.lca-startup-consulting.v1
      - independent.financial-analysis-tool.v1
    projects:
      - project.masters-thesis-computational
      - project.house-price-prediction
      - project.real-estate-development
      - project.computational-deployable-structures
    skills: [data_and_analysis, digital_tools, real_estate_and_urban, languages]

  # ---------------------------------------------------------------------------
  # NOT an application block. The other three point one direction on purpose;
  # this one deliberately does not, and exists for the cases where there is no
  # posting to point at: mentorship and career programmes, networking, career
  # fairs, "send us your CV" forms. It leans on the `generic` variants in
  # content_base.yaml and shows all four domains (real estate, ESG, data,
  # architecture) rather than choosing between them. Never extend it from an
  # application: a real posting always gets one of the three directional blocks.
  general:
    label: "General / No Specific Role"
    use_for: >
      Mentorship and career programme applications, networking, career fairs,
      speculative CV uploads. Used when there is no job description to tailor
      against and the CV has to represent the whole of Antonio's experience.
    profile: profile.real-estate-esg-data
    roles: [sweco, ramboll, isay, ospa, felipe, itau, independent]
    bullets:
      # Sweco: the infrastructure consulting frame, plus climate risk and GIS
      - sweco.department-anchor.v1
      - sweco.climate-risk-assessments.v1
      - sweco.azerbaijan-field-mission.v1
      - sweco.geospatial-data-and-analysis.v1

      # Ramboll: ESG and due diligence, with the real estate service line kept
      # so the sustainability work still reads as built-environment work
      - ramboll.frameworks-anchor.v1
      - ramboll.colt-salience-tool.v1
      - ramboll.real-estate-esg.v1
      - ramboll.critical-raw-materials-study.v1

      # Isay Weinfeld: the one role where all four domains are visible at once
      - isay.portfolio-anchor.v1
      - isay.buildable-capacity.v1
      - isay.staircase-grasshopper-plugin.v1
      - isay.environmental-daylight-analysis.v1

      # OSPA: feasibility and financial modeling, the real estate core
      - ospa.feasibility-anchor.v1
      - ospa.numerical-feasibility-financial-modeling.v1
      - ospa.zoning-land-use-regulatory.v1
      - ospa.client-presentations.v1

      # Felipe Hess: architecture practice with the development side attached
      - felipe.portfolio-anchor.v1
      - felipe.zoning-feasibility-study.v1
      - felipe.developer-first-building.v1

      # Itau: the corporate client side, plus a tool he built himself
      - itau.documentation-review-anchor.v1
      - itau.building-environmental-energy.v1
      - itau.furniture-inventory-tool.v1

      # Independent: initiative and ownership, which is what this CV is for
      - independent.anchor.v1
      - vizu.studio-anchor.v1
      - independent.lca-startup-consulting.v1
    projects:
      - project.masters-thesis-computational
      - project.real-estate-development
      - project.house-price-prediction
    skills: [real_estate_and_urban, data_and_analysis, esg_and_sustainability, digital_tools, languages]
